name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: '发布 tag（留空只构建 artifact）'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK Platform 37
        run: |
          # 本项目 compileSdk 用的是带小版本号的 android-37.0（AGP 8.13 的新命名格式），
          # 先按这个名字装；若镜像源还没同步，回退到不带小版本号的 android-37。
          # accept 全部许可，否则 sdkmanager 会卡在交互提示上直到 job 超时。
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platforms;android-37.0" "build-tools;36.0.0" \
            || sdkmanager --install "platforms;android-37" "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: chmod +x gradlew || true

      - name: Show environment
        run: |
          echo "== Java =="; java -version
          echo "== SDK =="; echo "$ANDROID_HOME"; ls "$ANDROID_HOME/platforms" || true
          echo "== compileSdk in build.gradle.kts =="
          grep -nE 'compileSdk|minSdk|targetSdk' app/build.gradle.kts || true

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p out
          find app/build/outputs/apk -name '*.apk' -exec cp {} out/ \;
          ls -la out/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: out/*.apk

      - name: Create Release
        if: github.event.inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          files: out/*.apk
